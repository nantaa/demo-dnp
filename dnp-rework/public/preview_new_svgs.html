<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #f1f5f9; padding: 30px; font-family: sans-serif; }</style>
</head>
<body class="space-y-6">
    <div class="flex items-center gap-6">
        <div>
            <div class="font-bold text-xs mb-1 text-slate-500">FIGMA TARGET:</div>
            <img src="/target2.png" class="w-[280px] rounded-xl border border-slate-300" />
        </div>
        
        <!-- Refined SVG Card with pill -->
        <div>
            <div class="font-bold text-xs mb-1 text-emerald-600">REFINED SVG (Kisses Pill Bottom, Clean Under Divider):</div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200/90 relative overflow-hidden w-[280px] shadow-xs">
                <!-- Dual Wave -->
                <div class="absolute bottom-0 right-0 pointer-events-none z-0 select-none leading-none w-[160px] h-[32px]">
                    <svg viewBox="0 0 160 32" fill="none" class="absolute bottom-0 right-0 w-[160px] h-[32px]">
                        <path opacity="0.41" d="M10 32C50 30 100 16 160 12V32H10Z" fill="#B1DFF7"/>
                    </svg>
                    <svg viewBox="0 0 160 32" fill="none" class="absolute bottom-0 right-0 w-[160px] h-[32px]">
                        <path d="M0 32C45 28 95 8 160 4V22C115 24 65 30 0 32Z" fill="url(#wave_cyan_card_r1)"/>
                        <defs>
                            <linearGradient id="wave_cyan_card_r1" x1="40" y1="6" x2="150" y2="30" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4ABFF0"/>
                                <stop offset="1" stop-color="#4ABFF0" stop-opacity="0.1"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[11px] font-bold bg-slate-100 px-2 py-0.5 rounded-full text-[#0A385C] border border-slate-200">PO: S1/X/2026</span>
                        <span class="text-[10px] font-extrabold px-2 py-0.5 bg-[#E0F2FE] text-[#0A385C] rounded-full border border-[#00A8E8]/30">2 Unit</span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 leading-tight mb-1">TEST STAGE 1</h3>
                    <p class="text-xs text-slate-500 mb-2 truncate">Proteksi Kebakaran (Form 65 K) • Kota Bekasi,...</p>
                    <div class="mt-3 flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-200/90 pt-2 relative z-10">
                        <span class="font-medium text-slate-500">MKT: <strong class="text-slate-700">Intang</strong></span>
                        <span class="w-[85px] h-[20px] rounded-full bg-red-100/90 border border-red-300"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Refined SVG Card WITHOUT pill -->
        <div>
            <div class="font-bold text-xs mb-1 text-slate-700">Stage 11C (No pill):</div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200/90 relative overflow-hidden w-[280px] shadow-xs">
                <!-- Dual Wave -->
                <div class="absolute bottom-0 right-0 pointer-events-none z-0 select-none leading-none w-[160px] h-[32px]">
                    <svg viewBox="0 0 160 32" fill="none" class="absolute bottom-0 right-0 w-[160px] h-[32px]">
                        <path opacity="0.41" d="M10 32C50 30 100 16 160 12V32H10Z" fill="#B1DFF7"/>
                    </svg>
                    <svg viewBox="0 0 160 32" fill="none" class="absolute bottom-0 right-0 w-[160px] h-[32px]">
                        <path d="M0 32C45 28 95 8 160 4V22C115 24 65 30 0 32Z" fill="url(#wave_cyan_card_r2)"/>
                        <defs>
                            <linearGradient id="wave_cyan_card_r2" x1="40" y1="6" x2="150" y2="30" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4ABFF0"/>
                                <stop offset="1" stop-color="#4ABFF0" stop-opacity="0.1"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[11px] font-bold bg-slate-100 px-2 py-0.5 rounded-full text-[#0A385C] border border-slate-200">PO: S11B/X/2026</span>
                        <span class="text-[10px] font-extrabold px-2 py-0.5 bg-[#E0F2FE] text-[#0A385C] rounded-full border border-[#00A8E8]/30">2 Unit</span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 leading-tight mb-1">TEST STAGE 11C</h3>
                    <p class="text-xs text-slate-500 mb-2 truncate">Pesawat Uap (Boiler) (Form 6) • Kota Bekasi, J...</p>
                    <div class="mt-3 flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-200/90 pt-2 relative z-10">
                        <span class="font-medium text-slate-500">MKT: <strong class="text-slate-700">Intang</strong></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
