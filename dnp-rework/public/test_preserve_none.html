<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #f1f5f9; padding: 30px; font-family: sans-serif; }</style>
</head>
<body class="space-y-6">
    <div class="flex items-center gap-6">
        <div>
            <div class="font-bold text-xs mb-1 text-slate-500">TARGET:</div>
            <img src="/target2.png" class="w-[280px] rounded-xl border border-slate-300" />
        </div>
        
        <!-- preserveAspectRatio="none" Card with pill -->
        <div>
            <div class="font-bold text-xs mb-1 text-blue-600">preserveAspectRatio="none" (w-[170px] h-[30px]):</div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200/90 relative overflow-hidden w-[280px] shadow-xs">
                <!-- Dual Wave -->
                <div class="absolute bottom-0 right-0 pointer-events-none z-0 select-none leading-none w-[170px] h-[30px]">
                    <svg viewBox="0 0 178 68" preserveAspectRatio="none" fill="none" class="absolute bottom-0 right-0 w-[145px] h-[24px]">
                        <path opacity="0.41" d="M0.158887 41.0282L9.18329e-06 67.9551C95.2567 18.2973 106.604 2.27715 177.059 21.0089C120.265 -10.6205 84.6216 -8.5443 0.158887 41.0282Z" fill="#B1DFF7"/>
                    </svg>
                    <svg viewBox="0 0 213 84" preserveAspectRatio="none" fill="none" class="absolute bottom-0 right-0 w-[170px] h-[30px]">
                        <path d="M212.508 83.3342L212.652 58.8123C161.854 31.5198 128.227 12.2315 105.172 4.58484C57.946 -7.88466 33.6576 7.09955 -2.05659e-06 25.3391C-2.05659e-06 25.3391 51.2766 3.87579 94.6169 22.458C137.957 41.0401 212.508 83.3342 212.508 83.3342Z" fill="url(#wg_pan)"/>
                        <defs>
                            <linearGradient id="wg_pan" x1="43.5112" y1="11.3829" x2="135.756" y2="-40.0729" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4ABFF0"/>
                                <stop offset="1" stop-color="#4ABFF0" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[11px] font-bold bg-slate-100 px-2 py-0.5 rounded-full text-[#0A385C] border border-slate-200">PO: S1/X/2026</span>
                        <span class="text-[10px] font-extrabold px-2 py-0.5 bg-[#E0F2FE] text-[#0A385C] rounded-full border border-[#00A8E8]/30">2 Unit</span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 leading-tight mb-1">TEST STAGE 1</h3>
                    <p class="text-xs text-slate-500 mb-2 truncate">Proteksi Kebakaran (Form 65 K) • Kota Bekasi,...</p>
                    <div class="mt-3 flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-200/90 pt-2 relative z-10">
                        <span class="font-medium text-slate-500">MKT: <strong class="text-slate-700">Intang</strong></span>
                        <span class="w-[85px] h-[20px] rounded-full bg-red-100/90 border border-red-300"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- preserveAspectRatio="none" Card WITHOUT pill -->
        <div>
            <div class="font-bold text-xs mb-1 text-slate-700">Stage 11C (No pill):</div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200/90 relative overflow-hidden w-[280px] shadow-xs">
                <!-- Dual Wave -->
                <div class="absolute bottom-0 right-0 pointer-events-none z-0 select-none leading-none w-[170px] h-[30px]">
                    <svg viewBox="0 0 178 68" preserveAspectRatio="none" fill="none" class="absolute bottom-0 right-0 w-[145px] h-[24px]">
                        <path opacity="0.41" d="M0.158887 41.0282L9.18329e-06 67.9551C95.2567 18.2973 106.604 2.27715 177.059 21.0089C120.265 -10.6205 84.6216 -8.5443 0.158887 41.0282Z" fill="#B1DFF7"/>

                        <defs>

                        <span class="text-[10px] font-extrabold px-2 py-0.5 bg-[#E0F2FE] text-[#0A385C] rounded-full border border-[#00A8E8]/30">2 Unit</span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 leading-tight mb-1">TEST STAGE 11C</h3>
                    <p class="text-xs text-slate-500 mb-2 truncate">Pesawat Uap (Boiler) (Form 6) • Kota Bekasi, J...</p>
                    <div class="mt-3 flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-200/90 pt-2 relative z-10">
                        <span class="font-medium text-slate-500">MKT: <strong class="text-slate-700">Intang</strong></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
