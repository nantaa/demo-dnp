<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Card Visual Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F1F5F9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-md mx-auto">
        <h1 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Kanban Card Visual Verification</h1>
        
        <!-- Column simulation matching user screenshot -->
        <div class="bg-[#F8FAFC] p-3 rounded-2xl border border-slate-200/80 w-[300px]">
            <div class="text-[11px] font-bold text-slate-700 mb-3 px-1">1 🔒 PO/SPK/PROPOSAL <span class="float-right text-slate-400 font-normal">2</span></div>

            <!-- Card 1: TEST STAGE 11C -->
            <div class="bg-white p-3.5 mb-3 rounded-xl shadow-xs border border-slate-200/90 cursor-pointer hover:border-[#00A8E8] hover:shadow-md transition-all group relative overflow-hidden">
                <!-- Dual Figma Wave Artwork (Vector 630 + Vector 632) positioned at Bottom-Right -->
                <div class="absolute bottom-0 right-0 pointer-events-none z-0 select-none leading-none w-[170px] h-[67px]">
                    <!-- Vector 630: light blue wave base layer (178x68) -->
                    <svg viewBox="0 0 178 68" fill="none" class="absolute bottom-0 right-0 w-[145px] h-auto">
                        <path opacity="0.41" d="M0.158887 41.0282L9.18329e-06 67.9551C95.2567 18.2973 106.604 2.27715 177.059 21.0089C120.265 -10.6205 84.6216 -8.5443 0.158887 41.0282Z" fill="#B1DFF7"/>
                    </svg>
                    <!-- Vector 632: cyan gradient wave foreground layer (213x84) -->
                    <svg viewBox="0 0 213 84" fill="none" class="absolute bottom-0 right-0 w-[170px] h-auto">
                        <path d="M212.508 83.3342L212.652 58.8123C161.854 31.5198 128.227 12.2315 105.172 4.58484C57.946 -7.88466 33.6576 7.09955 -2.05659e-06 25.3391C-2.05659e-06 25.3391 51.2766 3.87579 94.6169 22.458C137.957 41.0401 212.508 83.3342 212.508 83.3342Z" fill="url(#wg_card_1)"/>
                        <defs>
                            <linearGradient id="wg_card_1" x1="43.5112" y1="11.3829" x2="135.756" y2="-40.0729" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4ABFF0"/>
                                <stop offset="1" stop-color="#4ABFF0" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <!-- Main Card Content -->
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-1.5">
                        <span class="text-[11px] font-bold bg-slate-100 px-2 py-0.5 rounded-full text-[#0A385C] border border-slate-200">
                            PO: S11B/X/2026
                        </span>
                        <span class="text-[10px] font-extrabold px-2 py-0.5 bg-[#E0F2FE] text-[#0A385C] rounded-full border border-[#00A8E8]/30">
                            2 Unit
                        </span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 leading-tight mb-0.5">
                        TEST STAGE 11C
                    </h3>
                    <p class="text-xs text-slate-500 mb-2 truncate">Pesawat Uap (Boiler) (Form 6) • Kota Bekasi, J...</p>

                    <!-- Footer with Grey Divider Line (border-slate-200/90) and MKT + SLA Badge -->
                    <div class="mt-2.5 flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-200/90 pt-2 relative z-10">
                        <span class="font-medium text-slate-500">MKT: <strong class="text-slate-700">Intang</strong></span>
                        <span class="px-2.5 py-0.5 rounded-full bg-red-100 text-red-800 font-extrabold border border-red-200">HARI H</span>
                    </div>
                </div>
            </div>

            <!-- Card 2: TEST STAGE 1 -->
            <div class="bg-white p-3.5 rounded-xl shadow-xs border border-slate-200/90 cursor-pointer hover:border-[#00A8E8] hover:shadow-md transition-all group relative overflow-hidden">
                <div class="absolute bottom-0 right-0 pointer-events-none z-0 select-none leading-none w-[170px] h-[67px]">
                    <svg viewBox="0 0 178 68" fill="none" class="absolute bottom-0 right-0 w-[145px] h-auto">
                        <path opacity="0.41" d="M0.158887 41.0282L9.18329e-06 67.9551C95.2567 18.2973 106.604 2.27715 177.059 21.0089C120.265 -10.6205 84.6216 -8.5443 0.158887 41.0282Z" fill="#B1DFF7"/>
                    </svg>
                    <svg viewBox="0 0 213 84" fill="none" class="absolute bottom-0 right-0 w-[170px] h-auto">
                        <path d="M212.508 83.3342L212.652 58.8123C161.854 31.5198 128.227 12.2315 105.172 4.58484C57.946 -7.88466 33.6576 7.09955 -2.05659e-06 25.3391C-2.05659e-06 25.3391 51.2766 3.87579 94.6169 22.458C137.957 41.0401 212.508 83.3342 212.508 83.3342Z" fill="url(#wg_card_2)"/>
                        <defs>
                            <linearGradient id="wg_card_2" x1="43.5112" y1="11.3829" x2="135.756" y2="-40.0729" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4ABFF0"/>
                                <stop offset="1" stop-color="#4ABFF0" stop-opacity="0"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-1.5">
                        <span class="text-[11px] font-bold bg-slate-100 px-2 py-0.5 rounded-full text-[#0A385C] border border-slate-200">
                            PO: S1/X/2026
                        </span>
                        <span class="text-[10px] font-extrabold px-2 py-0.5 bg-[#E0F2FE] text-[#0A385C] rounded-full border border-[#00A8E8]/30">
                            2 Unit
                        </span>
                    </div>
                    <h3 class="font-bold text-sm text-slate-900 leading-tight mb-0.5">
                        TEST STAGE 1
                    </h3>
                    <p class="text-xs text-slate-500 mb-2 truncate">Proteksi Kebakaran (Form 65 K) • Kota Bekasi,...</p>

                    <div class="mt-2.5 flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-200/90 pt-2 relative z-10">
                        <span class="font-medium text-slate-500">MKT: <strong class="text-slate-700">Intang</strong></span>
                        <span class="px-2.5 py-0.5 rounded-full bg-red-100 text-red-800 font-extrabold border border-red-200">HARI H</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
