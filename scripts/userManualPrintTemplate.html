<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Panduan Pengguna Resmi - DNP Monitor</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 20mm 18mm 22mm 18mm;
      @top-left {
        content: "PT Delta Nusantara Persada — DNP Monitor";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 8pt;
        color: #333333;
        border-bottom: 0.5pt solid #cccccc;
        padding-bottom: 4px;
      }
      @top-right {
        content: "https://monitor-dnp.deltaindo.co.id/";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 8pt;
        color: #333333;
        border-bottom: 0.5pt solid #cccccc;
        padding-bottom: 4px;
      }
      @bottom-left {
        content: "Buku Panduan Pengguna (User Guide)";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 8pt;
        color: #555555;
        border-top: 0.5pt solid #cccccc;
        padding-top: 4px;
      }
      @bottom-right {
        content: "Halaman " counter(page);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 8pt;
        font-weight: 600;
        color: #000000;
        border-top: 0.5pt solid #cccccc;
        padding-top: 4px;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 9.5pt;
      line-height: 1.6;
      color: #111111;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* Page Breaks for Front Matter */
    .page-break {
      page-break-after: always !important;
      break-after: page !important;
      clear: both;
      height: 0;
      margin: 0;
      padding: 0;
    }

    /* Minimalist Black & White Cover Page */
    .cover-page {
      min-height: 84vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 40px;
      border: 1.5pt solid #000000;
      background: #ffffff;
      margin-bottom: 20px;
      page-break-after: always !important;
      break-after: page !important;
    }

    .cover-page h1 {
      font-size: 24pt;
      font-weight: 800;
      color: #000000;
      margin: 12px 0 6px 0;
      border-bottom: none;
      padding: 0;
      letter-spacing: 0.02em;
    }

    .cover-page h2 {
      font-size: 13pt;
      font-weight: 600;
      color: #222222;
      margin: 0 0 20px 0;
      border-bottom: none;
      padding: 0;
    }

    .cover-page h3 {
      font-size: 10.5pt;
      font-weight: 700;
      color: #000000;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: none;
      padding: 0;
    }

    .cover-page .cover-url {
      display: inline-block;
      border: 1pt solid #000000;
      padding: 5px 14px;
      font-size: 9pt;
      font-weight: 600;
      color: #000000;
      background: #ffffff;
      margin: 24px 0 32px 0;
    }

    .cover-page .cover-meta {
      font-size: 8.5pt;
      color: #333333;
      line-height: 1.8;
      border-top: 1pt solid #000000;
      padding-top: 20px;
      width: 85%;
      margin: 0 auto;
    }

    /* Clean Dual-Tone Headings */
    h1 {
      color: #000000;
      font-size: 13.5pt;
      font-weight: 700;
      border-bottom: 1pt solid #000000;
      padding-bottom: 3px;
      margin-top: 24px;
      margin-bottom: 10px;
      page-break-after: avoid;
      break-after: avoid;
    }

    h2 {
      color: #111111;
      font-size: 11pt;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 6px;
      border-bottom: 0.5pt solid #666666;
      padding-bottom: 2px;
      page-break-after: avoid;
      break-after: avoid;
    }

    h3 {
      color: #222222;
      font-size: 9.5pt;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 4px;
      page-break-after: avoid;
      break-after: avoid;
    }

    p {
      margin: 0 0 8px 0;
      text-align: justify;
    }

    ul, ol {
      margin: 4px 0 10px 0;
      padding-left: 20px;
    }

    li {
      margin-bottom: 3px;
    }

    strong {
      color: #000000;
      font-weight: 600;
    }

    a {
      color: #000000;
      text-decoration: underline;
    }

    /* Dual Tone Figures */
    .figure-block {
      page-break-inside: avoid;
      break-inside: avoid;
      text-align: center;
      margin: 14px 0 18px 0;
      padding: 8px;
      background: #ffffff;
      border: 0.75pt solid #666666;
      border-radius: 2px;
    }

    .figure-block img {
      max-width: 96%;
      height: auto;
      border: 0.5pt solid #888888;
      display: block;
      margin: 0 auto;
    }

    .figure-caption {
      font-size: 8pt;
      font-weight: 600;
      color: #111111;
      margin-top: 6px;
    }

    /* Dual Tone Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 14px 0;
      font-size: 8.5pt;
      page-break-inside: avoid;
      break-inside: avoid;
      border: 1pt solid #000000;
    }

    thead {
      background-color: #f2f2f2;
      color: #000000;
      font-weight: 700;
      display: table-header-group;
      border-bottom: 1pt solid #000000;
    }

    th {
      padding: 6px 8px;
      text-align: left;
      font-weight: 700;
      border: 0.75pt solid #444444;
      color: #000000;
    }

    td {
      padding: 5px 8px;
      border: 0.5pt solid #888888;
      vertical-align: top;
      color: #111111;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }

    /* Clean B&W Blockquotes / Notes */
    blockquote {
      margin: 8px 0;
      padding: 6px 12px;
      background-color: #f7f7f7;
      border-left: 2pt solid #000000;
      color: #111111;
      font-size: 8.5pt;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    code {
      font-family: "Courier New", Courier, monospace;
      font-size: 8pt;
      background-color: #f2f2f2;
      color: #000000;
      padding: 1px 3px;
      border: 0.5pt solid #cccccc;
    }

    hr {
      border: 0;
      height: 0.75pt;
      background: #888888;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="content-container">
    {{BODY_CONTENT}}
  </div>
</body>
</html>
