<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Panduan Pengguna Resmi - DNP Monitor</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 16mm 14mm 18mm 14mm;
      @top-left {
        content: "PT Delta Nusantara Persada — DNP Monitor Riksa Uji";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 8pt;
        color: #64748b;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 4px;
      }
      @top-right {
        content: "https://monitor-dnp.deltaindo.co.id/";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 8pt;
        color: #0284c7;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 4px;
      }
      @bottom-left {
        content: "Buku Petunjuk Operasional Karyawan & Pengguna Sistem (User Guide v2.4)";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 8pt;
        color: #64748b;
        border-top: 1px solid #e2e8f0;
        padding-top: 4px;
      }
      @bottom-right {
        content: "Halaman " counter(page);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 8pt;
        font-weight: 600;
        color: #1e293b;
        border-top: 1px solid #e2e8f0;
        padding-top: 4px;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 9.5pt;
      line-height: 1.55;
      color: #1e293b;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* Cover / Title banner */
    .cover-card {
      background: linear-gradient(135deg, #062444 0%, #0e3d6f 100%);
      color: #ffffff;
      padding: 32px 30px;
      border-radius: 8px;
      margin-bottom: 24px;
      border-left: 8px solid #00a8e8;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .cover-card h1 {
      margin: 0 0 6px 0;
      font-size: 21pt;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      border-bottom: none;
      padding: 0;
    }
    .cover-card .company-name {
      font-size: 13pt;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }
    .cover-card .portal-badge {
      display: inline-block;
      background: rgba(0, 168, 232, 0.2);
      border: 1px solid #38bdf8;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 9.5pt;
      font-weight: 600;
      color: #e0f2fe;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    .cover-card .doc-meta {
      font-size: 8.5pt;
      color: #cbd5e1;
      display: flex;
      gap: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 10px;
      margin-top: 6px;
    }

    h1 {
      color: #062444;
      font-size: 15pt;
      font-weight: 700;
      border-bottom: 2px solid #00a8e8;
      padding-bottom: 4px;
      margin-top: 28px;
      margin-bottom: 12px;
      page-break-after: avoid;
      break-after: avoid;
    }

    h2 {
      color: #0f4c81;
      font-size: 12pt;
      font-weight: 700;
      margin-top: 20px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 3px;
      page-break-after: avoid;
      break-after: avoid;
    }

    h3 {
      color: #1e3a5f;
      font-size: 10.5pt;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
      page-break-after: avoid;
      break-after: avoid;
    }

    p {
      margin: 0 0 8px 0;
      text-align: justify;
    }

    ul, ol {
      margin: 4px 0 10px 0;
      padding-left: 22px;
    }

    li {
      margin-bottom: 3px;
    }

    strong {
      color: #0f172a;
      font-weight: 600;
    }

    /* Embedded Figures (BigBuilder Style) */
    .figure-block {
      page-break-inside: avoid;
      break-inside: avoid;
      text-align: center;
      margin: 16px 0 20px 0;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }

    .figure-block img {
      max-width: 95%;
      height: auto;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      display: block;
      margin: 0 auto;
    }

    .figure-caption {
      font-size: 8.5pt;
      font-weight: 600;
      color: #334155;
      margin-top: 8px;
      letter-spacing: 0.01em;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 16px 0;
      font-size: 8.5pt;
      page-break-inside: avoid;
      break-inside: avoid;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      overflow: hidden;
    }

    thead {
      background-color: #062444;
      color: #ffffff;
      font-weight: 600;
      display: table-header-group;
    }

    th {
      padding: 7px 9px;
      text-align: left;
      font-weight: 600;
      border: 1px solid #334155;
    }

    td {
      padding: 6px 9px;
      border: 1px solid #e2e8f0;
      vertical-align: top;
    }

    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    /* Callout & Blockquotes */
    blockquote {
      margin: 10px 0;
      padding: 8px 14px;
      background-color: #f0fdf4;
      border-left: 4px solid #16a34a;
      color: #166534;
      border-radius: 0 4px 4px 0;
      font-size: 9pt;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 8.5pt;
      background-color: #f1f5f9;
      color: #0369a1;
      padding: 1px 4px;
      border-radius: 3px;
      border: 1px solid #e2e8f0;
    }

    hr {
      border: 0;
      height: 1px;
      background: #e2e8f0;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="content-container">
    {{BODY_CONTENT}}
  </div>
</body>
</html>
